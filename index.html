<!doctype html> <html lang="en"> <head> <meta charset="utf-8" /> <meta name="viewport" content="width=device-width,initial-scale=1" /> <title>Debug — foxButton + C key test</title> <style> html,body{height:100%;margin:0;font-family:"Times New Roman", Times, serif;background:#fff} #stage{position:fixed;inset:0;overflow:hidden} #controls{position:fixed;left:12px;top:12px;z-index:9999;background:#111;color:#fff;padding:10px;border-radius:8px} #mode{font-weight:bold;margin-bottom:8px} #log{max-width:360px;max-height:240px;overflow:auto;background:#222;padding:8px;border-radius:6px;font-size:13px} #foxButton{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:9998;padding:10px 14px;border:3px solid black;border-radius:8px;background:#fff;cursor:pointer} .mickey{position:absolute;width:120px;pointer-events:none} </style> </head> <body> <div id="stage"> <!-- two starter images; replace with your files if you want --> <img class="mickey" src="classic-mickey-mouse5.png" style="left:20px;top:80px" alt=""> <img class="mickey" src="classic-mickey-mouse7.png" style="left:220px;top:160px" alt=""> </div> <div id="controls"> <div id="mode">Mode: <span id="modeState">Calm</span></div> <div><strong>Instructions:</strong> Click the button or press the <code>C</code> key. Open Console to see logs.</div> <div style="margin-top:8px"> <button id="btnTest">Console Key Test</button> <small style="display:block;margin-top:6px;color:#aaa">This adds a console listener if you want an extra test.</small> </div> <hr style="margin:8px 0;border:none;border-top:1px solid #333"> <div id="log"></div> </div>
<button id="foxButton" aria-pressed="false">the quick brown fox jumps over the lazy dog</button>

<script> // small helper to append on-screen log + console function log(msg) { console.log(msg); const el = document.getElementById('log'); const d = document.createElement('div'); d.textContent = (new Date()).toLocaleTimeString() + ' — ' + msg; el.prepend(d); // keep only 100 lines on screen while (el.childNodes.length > 100) el.removeChild(el.lastChild); } // wire the button const foxBtn = document.getElementById('foxButton'); const modeState = document.getElementById('modeState'); let crazy = false; function setCrazy(on) { crazy = on; foxBtn.setAttribute('aria-pressed', String(on)); modeState.textContent = on ? 'CRAZY' : 'Calm'; log('setCrazy -> ' + (on ? 'ON' : 'OFF')); // visual feedback: add/remove a class to stage to shake document.getElementById('stage').style.transform = on ? 'translate3d(4px, -3px, 0) rotate(-0.6deg)' : ''; } foxBtn.addEventListener('click', () => { setCrazy(!crazy); log('button clicked'); }); // keydown capture window.addEventListener('keydown', (e) => { // ignore typing in inputs (none in this test page) const tag = document.activeElement && document.activeElement.tagName; if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement?.isContentEditable) return; log('keydown: ' + e.key); if (e.key.toLowerCase() === 'c') { setCrazy(!crazy); log('C key toggled crazy'); } else if (e.key === 'Escape') { setCrazy(false); log('Escape pressed -> calm'); } }); // small utility: add a console listener on demand document.getElementById('btnTest').addEventListener('click', () => { console.log('Console key test installed: press keys to see events logged in console.'); window.addEventListener('keydown', (e) => console.log('console listener sees:', e.key)); log('Installed console key listener'); }); // auto-focus body so key events register in some browsers window.setTimeout(() => { try { (document.body).focus(); } catch (e) {} }, 200); log('Debug page ready
